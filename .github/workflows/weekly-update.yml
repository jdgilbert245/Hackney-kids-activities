name: Weekly events update

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC; the gate below skips even ISO weeks, so it runs fortnightly
  workflow_dispatch:       # run it by hand from the Actions tab (always runs)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fortnightly gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( 10#$(date +%V) % 2 )) -eq 1 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF tools
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Using a Claude subscription instead? Swap the line above for:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Today is the update run. Follow the instructions in AGENT.md exactly.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 150
            --disallowedTools "Agent,Task"
            --allowedTools "Read,Write,Edit,WebSearch,WebFetch,Bash(curl:*),Bash(pdftotext:*),Bash(python3 -m json.tool:*),Bash(date:*),Bash(git:*),Bash(gh pr create:*)"
